name: CI

on:
  pull_request:
  push:
    branches: [master, 'cursor/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Lint
        run: bun lint

      - name: Build
        run: bun run build

      # Catches wrangler CLI/config regressions without credentials.
      - name: Worker dry-run
        run: bunx wrangler deploy --dry-run --autoconfig=false --config worker/wrangler.toml --outdir "$RUNNER_TEMP/worker-dist"

      - name: Build docs
        run: bun run docs:build
        env:
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_ADMIN_API: ${{ vars.VITE_ADMIN_API }}
