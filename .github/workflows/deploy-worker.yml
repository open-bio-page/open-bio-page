name: Deploy admin worker

on:
  push:
    branches: [master]
    paths:
      - 'worker/**'
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository != 'open-bio-page/open-bio-page'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: cf
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::notice title=Deploy admin worker skipped::CLOUDFLARE_API_TOKEN is not set, so the admin Worker was not deployed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions to enable it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.cf.outputs.enabled == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.cf.outputs.enabled == 'true'
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
        if: steps.cf.outputs.enabled == 'true'

      - name: Deploy and push secrets
        if: steps.cf.outputs.enabled == 'true'
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          POSTHOG_READ_KEY: ${{ secrets.POSTHOG_READ_KEY }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
        run: |
          set -euo pipefail
          CFG="--config worker/wrangler.toml"
          bunx wrangler deploy --autoconfig=false $CFG
          put_secret() { # $1 = Worker secret name, $2 = value, $3 = GitHub secret name
            if [ -z "$2" ]; then
              echo "::warning::$3 is not set; skipped Worker secret $1"
              return 0
            fi
            printf '%s' "$2" | bunx wrangler secret put "$1" $CFG
          }
          put_secret SESSION_SECRET "$SESSION_SECRET" SESSION_SECRET
          put_secret GITHUB_TOKEN "$ADMIN_GITHUB_TOKEN" ADMIN_GITHUB_TOKEN
          put_secret POSTHOG_READ_KEY "$POSTHOG_READ_KEY" POSTHOG_READ_KEY
          put_secret ADMIN_USERS "$ADMIN_USERS" ADMIN_USERS
